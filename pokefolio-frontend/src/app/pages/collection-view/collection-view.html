<section class="collection-view">
  @if (groupedCards().length) {
    <div class="collection-view__grid">
      @for (group of groupedCards(); track group.card.id) {
        <a [routerLink]="['/app/collections', collectionId, 'card', group.card.id]" class="collection-view__grid-item">
          <app-pokemon-card
            [imageUrl]="group.card.imageUrl"
            [name]="group.card.name"
            [quantity]="group.totalQuantity"
            [subtitle]="group.card.setName + ' · ' + group.card.cardNumber"
          />
        </a>
      }
    </div>
  } @else {
    <div class="collection-view__empty">
      <mat-icon>catching_pokemon</mat-icon>
      <p>Diese Collection enthält noch keine Karten.</p>
    </div>
  }

  <button
    (click)="addCard()"
    aria-label="Karte hinzufügen"
    class="collection-view__fab"
    color="primary"
    mat-fab
  >
    <mat-icon>add</mat-icon>
  </button>
</section>
